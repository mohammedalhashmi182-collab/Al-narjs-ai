name: journal-postgres

# Disposable PostgreSQL verifies real row-lock, claim and crash-fencing behavior.
# It never connects to Neon, Render, real customers or the production branch.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/models/service_delivery.py"
      - "src/models/__init__.py"
      - "src/services/service_fulfillment_journal.py"
      - "src/automation/workflow_engine.py"
      - "src/services/docgen/journal_runner.py"
      - "tests/test_journal_postgres_integration.py"
      - ".github/workflows/journal-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: narjis_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: narjis_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U narjis_ci -d narjis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_DSN: postgresql+asyncpg://narjis_ci:local-ci-only@127.0.0.1:5432/narjis_ci
      SECRET_KEY: test-only-not-for-production
      OWNER_PASSWORD: test-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess, sys, tomllib
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]
          deps = list(project["dependencies"]) + list(project.get("optional-dependencies", {}).get("dev", []))
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY
      - name: Exercise actual PostgreSQL leases and stale-worker fencing
        run: python -m pytest -q tests/test_journal_postgres_integration.py
      - name: Verify disposable PostgreSQL backup and isolated restore
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /postgres:17-alpine/ { print $1; exit }')"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" pg_dump -U narjis_ci -d narjis_ci -Fc --no-owner --no-acl -f /tmp/journal-ci.dump
          docker exec "$PG_CONTAINER" createdb -U narjis_ci narjis_ci_restore
          docker exec "$PG_CONTAINER" pg_restore -U narjis_ci -d narjis_ci_restore --no-owner --no-acl /tmp/journal-ci.dump
          for table in service_jobs service_journal_events service_step_checkpoints service_artifacts; do
            source_count="$(docker exec "$PG_CONTAINER" psql -U narjis_ci -d narjis_ci -tAc "select count(*) from $table")"
            restored_count="$(docker exec "$PG_CONTAINER" psql -U narjis_ci -d narjis_ci_restore -tAc "select count(*) from $table")"
            echo "$table: source=$source_count restored=$restored_count"
            test "$source_count" = "$restored_count"
            test "$source_count" -gt 0
          done
          source_digests="$(docker exec "$PG_CONTAINER" psql -U narjis_ci -d narjis_ci -tAc "select md5(string_agg(content_sha256, '|' order by content_sha256)) from service_step_checkpoints")"
          restored_digests="$(docker exec "$PG_CONTAINER" psql -U narjis_ci -d narjis_ci_restore -tAc "select md5(string_agg(content_sha256, '|' order by content_sha256)) from service_step_checkpoints")"
          test "$source_digests" = "$restored_digests"
          source_artifacts="$(docker exec "$PG_CONTAINER" psql -U narjis_ci -d narjis_ci -tAc "select md5(string_agg(sha256, '|' order by sha256)) from service_artifacts")"
          restored_artifacts="$(docker exec "$PG_CONTAINER" psql -U narjis_ci -d narjis_ci_restore -tAc "select md5(string_agg(sha256, '|' order by sha256)) from service_artifacts")"
          test "$source_artifacts" = "$restored_artifacts"
          echo "Synthetic PostgreSQL backup and restore verified."
