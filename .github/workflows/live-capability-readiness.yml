name: live-capability-readiness
on:
  push:
    branches: [audit/live-capability-readiness]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/live_capability_readiness.py
