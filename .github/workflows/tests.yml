# Runs the real test suite. Every commit to main auto-deploys to production
# within a minute (Render), so this gate is the last thing standing between a
# broken change and a broken live site.
#
# The suite is self-contained: tests/conftest.py sets SECRET_KEY, OWNER_PASSWORD
# and a SQLite DATABASE_URL, so no secrets and no external services are needed.
#
# Dependencies are read straight out of pyproject.toml rather than via
# `pip install -e .`: the project is not packaged (no [tool.setuptools] section)
# and the tests import `src.*` from the repo root, which is why the documented
# command is `python -m pytest` and not bare `pytest`.
name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install WeasyPrint system libraries for DocPack PDFs
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libcairo2 libgdk-pixbuf-2.0-0 shared-mime-info

      - name: Install runtime and dev dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess, sys, tomllib
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]
          deps = list(project["dependencies"])
          deps += list(project.get("optional-dependencies", {}).get("dev", []))
          print(f"installing {len(deps)} dependencies")
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY

      - name: Show the resolved environment
        run: |
          python -c "import sys, fastapi, sqlalchemy; print(sys.version); print('fastapi', fastapi.__version__); print('sqlalchemy', sqlalchemy.__version__)"

      - name: Run the test suite
        run: python -m pytest -q --disable-socket --allow-unix-socket

      - name: Install Chromium for mobile acceptance
        run: python -m playwright install --with-deps chromium

      - name: Check public mobile pages and loading failures
        env:
          RUN_BROWSER_TESTS: "1"
        run: python -m pytest -q tests/test_public_mobile.py tests/test_home_intro.py tests/test_voice_aurora.py --disable-socket --allow-unix-socket

  # Scoped to the modules added for the public pages so the existing tree
  # does not fail this job. The check name of the suite above stays
  # `tests / pytest`.
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.3.0"
      - name: Lint the platform modules
        # The repository select in pyproject.toml is strict enough to fail on
        # the existing tree (and on bilingual string literals). This job stays
        # on the new modules and on rules that catch real mistakes.
        run: >-
          ruff check
          --select E,F,I,UP,W
          --ignore E501
          src/version.py
          src/services/public_openapi.py
          src/services/public_status.py
          src/services/changelog_data.py
          src/services/sla.py
          src/services/partnerships.py
          src/services/case_studies.py
          tests/test_platform_pages.py

  # Advisory. A finding is printed and the job still succeeds, so a
  # pre-existing advisory cannot turn the pull request red. The required
  # signal remains `tests / pytest`.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: python -m pip install pip-audit bandit
      - name: Write runtime requirements for pip-audit
        run: |
          python - <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          pathlib.Path("/tmp/runtime-reqs.txt").write_text(
              "\n".join(project["dependencies"]) + "\n", encoding="utf-8"
          )
          PY
      - name: pip-audit
        continue-on-error: true
        run: python -m pip_audit -r /tmp/runtime-reqs.txt
      - name: bandit
        continue-on-error: true
        run: python -m bandit -r src -ll -q
