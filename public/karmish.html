<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كرميش - التوأم الرقمي لشركة النرجس</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Tajawal", sans-serif; background-color: #0b0f19; color: #f3f4f6; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 260px; background-color: #111827; border-left: 1px solid #1f2937; padding: 20px; display: flex; flex-direction: column; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #111827 0%, #0b0f19 100%); }
        .chat-header { padding: 20px; border-bottom: 1px solid #1f2937; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #d4af37, #9a7b1c); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0b0f19; box-shadow: 0 0 15px rgba(212,175,55,0.3); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 75%; padding: 15px 20px; border-radius: 12px; line-height: 1.6; }
        .message.user { background-color: #1f2937; align-self: flex-start; border-bottom-right-radius: 2px; }
        .message.bot { background: rgba(212, 175, 55, 0.08); border: 1px solid rgba(212, 175, 55, 0.2); align-self: flex-end; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 25px; background: transparent; display: flex; justify-content: center; }
        .input-box { width: 80%; background-color: #1f2937; border: 1px solid #374151; border-radius: 30px; padding: 15px 25px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .input-box input { flex: 1; background: none; border: none; color: white; outline: none; font-size: 16px; }
        .input-box button { background: #d4af37; border: none; color: #0b0f19; font-weight: bold; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .input-box button:hover { background: #f3cd57; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: #d4af37; font-size: 20px; margin-bottom: 30px;">شركة النرجس</h2>
        <div style="flex: 1; color: #9ca3af; font-size: 14px;">محادثات التوأم الرقمي السابقة...</div>
    </div>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">K</div>
            <div>
                <h3 style="margin: 0; font-size: 18px; color: #d4af37;">كرميش</h3>
                <span style="font-size: 12px; color: #10b981;">● متصل بصلاحيات كاملة للتحكم بالنظام</span>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">مرحباً بك يا مالكي العزيز. أنا توأمك الرقمي "كرميش". نظام الـ 33 وكيلاً والـ CEO يعملون الآن تحت إمرتي بالكامل. ما هو الأمر الذي تريدني أن أنفذه على السيرفر أو الأجهزة فوراً؟</div>
        </div>
        <div class="chat-input-area">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="أرسل أمراً لتنفيذه تلقائياً دون تدخل بشري...">
                <button onclick="sendMessage()">تنفيذ الأمر</button>
            </div>
        </div>
    </div>
</body>
</html>
