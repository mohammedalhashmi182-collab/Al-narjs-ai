services:
  - type: web
    name: al-narjis-ai
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: al-narjis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: MOONSHOT_BASE_URL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MOYASAR_API_SECRET
        sync: false
      - key: MOYASAR_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://karmaai.online","https://www.karmaai.online"]'
      - key: DOMAIN
        value: karmaai.online
      - key: TIMEZONE
        value: Asia/Riyadh

databases:
  - name: al-narjis-db
    plan: basic
    databaseName: al_narjis
    user: al_narjis
