<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e4e3e2"/></linearGradient>
    <linearGradient id="echo" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6f5f4" stop-opacity=".34"/><stop offset="1" stop-color="#f6f5f4" stop-opacity="0"/></linearGradient>
    <radialGradient id="eye" cx="50%" cy="40%" r="60%"><stop stop-color="#ff8a6a"/><stop offset="1" stop-color="#ff5a36"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop stop-color="#ff5a36" stop-opacity=".35"/><stop offset="1" stop-color="#ff5a36" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- The Narcissus myth: the letter nun leans over still water and meets its reflection. -->
  <circle cx="200" cy="96" r="70" fill="url(#halo)"/>
  <path d="M108 150v20a92 92 0 0 0 184 0v-20" stroke="url(#body)" stroke-width="26" stroke-linecap="round"/>
  <circle cx="200" cy="96" r="22" fill="url(#eye)"/>
  <path d="M40 300h320" stroke="#ff5a36" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="200" cy="300" rx="120" ry="10" stroke="#ff5a36" stroke-opacity=".35" stroke-width="2"/>
  <ellipse cx="200" cy="300" rx="170" ry="16" stroke="#ff5a36" stroke-opacity=".18" stroke-width="2"/>
  <path d="M108 450v-20a92 92 0 0 1 184 0v20" stroke="url(#echo)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="200" cy="504" r="16" fill="#ff5a36" opacity=".16"/>
</svg>
