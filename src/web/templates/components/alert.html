{% macro alert(message='', variant='status', class_name='', attrs=none, role='status') -%}
<div role="{{ role }}" aria-live="polite" class="ui-alert ui-alert--{{ variant }}{% if class_name %} {{ class_name }}{% endif %}"{{ (attrs or {})|xmlattr }}>{{ caller() if caller is defined else message }}</div>
{%- endmacro %}
