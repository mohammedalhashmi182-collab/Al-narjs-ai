{% macro lockup(href, name, mark_url, descriptor='') -%}
<a class="logo" href="{{ href }}">
    <span class="gem" data-narjis-gem>
        <img src="{{ mark_url }}" alt="" width="36" height="36">
    </span>
    <span class="logo-txt"><span class="logo-name">{{ name }}</span>{% if descriptor %}<span class="logo-sub">{{ descriptor }}</span>{% endif %}</span>
</a>
{%- endmacro %}
