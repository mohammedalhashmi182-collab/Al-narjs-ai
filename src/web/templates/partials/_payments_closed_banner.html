{#- Shown above plans while no real payment method is open. Needs: _ar (bool). -#}
{% if not payments_open() %}
<div class="payments-closed-banner" id="paymentsClosedBanner" role="status" dir="{{ 'rtl' if _ar else 'ltr' }}" style="margin:0 auto 18px;max-width:880px;padding:14px 18px;border-radius:14px;border:1px solid #FF5A36;background:#000000;color:#FF5A36;font-weight:700;line-height:1.7;text-align:center;">
    {% if _ar %}{{ payments_closed_ar }}{% else %}{{ payments_closed_en }}{% endif %}
</div>
{% endif %}
