{# Public entry to the live voice agent. Not a text chat widget. #}
<link rel="stylesheet" href="/static/css/narjis-voice.css">
{% set _vl = page_lang(request) %}
{% if request.url.path not in ('/home', '/', '/ar', '/en', '/ar/home', '/en/home') %}
<a class="nj-voice-launch" id="voiceLauncher" href="/{{ _vl }}/voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
    </svg>
    <span>{% if _vl == 'ar' %}تحدث مع مستشارنا{% else %}Talk to our agent{% endif %}</span>
</a>
{% endif %}
